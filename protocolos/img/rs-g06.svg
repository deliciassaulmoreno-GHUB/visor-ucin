<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="Helvetica, Arial, sans-serif" font-size="17">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f4e8c"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
  </defs>
  <rect width="760" height="620" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f4e8c">Oxigenación: reclutamiento al pasar a VAFO</text>

  <!-- paso 1 -->
  <rect x="210" y="60" width="340" height="50" rx="12" fill="#2f6fbf"/>
  <text x="380" y="91" text-anchor="middle" fill="#fff" font-weight="bold">PMA de inicio: PMA en VMC + 2 cmH₂O</text>
  <line x1="380" y1="110" x2="380" y2="140" stroke="#1f4e8c" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- paso 2 -->
  <rect x="260" y="142" width="240" height="44" rx="12" fill="#2f6fbf"/>
  <text x="380" y="170" text-anchor="middle" fill="#fff" font-weight="bold">↑ PMA 1-2 cmH₂O / 2 min</text>
  <rect x="515" y="140" width="232" height="50" fill="#fff" stroke="#333"/>
  <text x="631" y="161" text-anchor="middle" font-size="14">Hasta SpO₂ 90-95 % sin cambios</text>
  <text x="631" y="180" text-anchor="middle" font-size="14">hemodinámicos y/o FiO₂ &lt; 0,4</text>
  <line x1="380" y1="186" x2="380" y2="216" stroke="#1f4e8c" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- paso 3 -->
  <rect x="260" y="218" width="240" height="44" rx="12" fill="#2f6fbf"/>
  <text x="380" y="246" text-anchor="middle" fill="#fff" font-weight="bold">↓ PMA 1-2 cmH₂O / 2 min</text>
  <rect x="515" y="224" width="232" height="32" fill="#fff" stroke="#333"/>
  <text x="631" y="245" text-anchor="middle" font-size="14">Hasta que SpO₂ &lt; 90 %</text>
  <line x1="380" y1="262" x2="380" y2="292" stroke="#1f4e8c" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- vigilancia -->
  <path d="M250 146 q-14 0 -14 14 v28 q0 12 -12 12 q12 0 12 12 v28 q0 14 14 14" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="14" y="170" width="200" height="60" fill="#fff" stroke="#333"/>
  <text x="114" y="195" text-anchor="middle" font-size="15" font-weight="bold">Vigilancia estrecha</text>
  <text x="114" y="217" text-anchor="middle" font-size="15">Mantener CO₂tc estable</text>

  <!-- paso 4 -->
  <rect x="220" y="294" width="320" height="44" rx="12" fill="#2f6fbf"/>
  <text x="380" y="322" text-anchor="middle" fill="#fff" font-weight="bold">Añadir 2 cmH₂O a la última PMA</text>
  <line x1="540" y1="316" x2="565" y2="316" stroke="#333" stroke-width="2"/>
  <rect x="565" y="300" width="180" height="32" fill="#222"/>
  <text x="655" y="321" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">Presión de apertura</text>
  <line x1="380" y1="338" x2="380" y2="366" stroke="#1f4e8c" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- rx -->
  <rect x="320" y="368" width="120" height="40" rx="10" fill="#aeae77"/>
  <text x="380" y="394" text-anchor="middle" font-weight="bold">Rx tórax</text>
  <line x1="380" y1="408" x2="155" y2="448" stroke="#555" stroke-width="2" marker-end="url(#g)"/>
  <line x1="380" y1="408" x2="380" y2="448" stroke="#555" stroke-width="2" marker-end="url(#g)"/>
  <line x1="380" y1="408" x2="605" y2="448" stroke="#555" stroke-width="2" marker-end="url(#g)"/>

  <g font-size="15">
    <rect x="65" y="450" width="180" height="52" rx="10" fill="#e5e59c" stroke="#aeae77"/>
    <text x="155" y="472" text-anchor="middle">Diafragma encima</text><text x="155" y="492" text-anchor="middle">de la 9.ª costilla</text>
    <rect x="290" y="450" width="180" height="52" rx="10" fill="#e5e59c" stroke="#aeae77"/>
    <text x="380" y="472" text-anchor="middle">Diafragma en</text><text x="380" y="492" text-anchor="middle">la 9.ª costilla</text>
    <rect x="515" y="450" width="180" height="52" rx="10" fill="#e5e59c" stroke="#aeae77"/>
    <text x="605" y="472" text-anchor="middle">Diafragma debajo</text><text x="605" y="492" text-anchor="middle">de la 9.ª costilla</text>
  </g>
  <line x1="155" y1="502" x2="155" y2="530" stroke="#555" stroke-width="2" marker-end="url(#g)"/>
  <line x1="380" y1="502" x2="380" y2="530" stroke="#555" stroke-width="2" marker-end="url(#g)"/>
  <line x1="605" y1="502" x2="605" y2="530" stroke="#555" stroke-width="2" marker-end="url(#g)"/>
  <g font-size="18" font-weight="bold">
    <rect x="105" y="532" width="100" height="40" rx="10" fill="#eeeecc" stroke="#999"/><text x="155" y="558" text-anchor="middle">↑ PMA</text>
    <rect x="330" y="532" width="100" height="40" rx="10" fill="#eeeecc" stroke="#999"/><text x="380" y="558" text-anchor="middle">PMA =</text>
    <rect x="555" y="532" width="100" height="40" rx="10" fill="#eeeecc" stroke="#999"/><text x="605" y="558" text-anchor="middle">↓ PMA</text>
  </g>
  <text x="380" y="605" text-anchor="middle" font-size="12" fill="#666">Redibujado a partir del Curso de Asistencia Respiratoria Neonatal, tema 7 (diapositiva «Oxigenación»)</text>
</svg>
