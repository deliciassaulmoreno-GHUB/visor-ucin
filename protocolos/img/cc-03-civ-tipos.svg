<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 374" role="img" aria-label="Tipos de CIV"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="380" height="374" fill="#fff"/><path d="M40,60 L340,60 L340,170 Q340,290 190,300 Q40,290 40,170 Z" fill="#e8eef9" stroke="#3a3a3a" stroke-width="3"/><text x="190" y="30" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="700" fill="#222" text-anchor="middle">Tabique interventricular visto desde el VD</text><ellipse cx="286" cy="58" rx="40" ry="16" fill="#fff" stroke="#3a3a3a" stroke-width="2"/><text x="286" y="62" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="700" fill="#333" text-anchor="middle">VP</text><ellipse cx="92" cy="122" rx="46" ry="34" fill="#fff" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="5 3"/><text x="92" y="126" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="700" fill="#333" text-anchor="middle">VT</text><ellipse cx="270" cy="92" rx="30" ry="14" fill="#9a5fb0" stroke="#3a3a3a" stroke-width="2" opacity="0.9"/><text x="270" y="96" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="700" fill="#222" text-anchor="middle">Salida</text><ellipse cx="158" cy="96" rx="28" ry="16" fill="#9a5fb0" stroke="#3a3a3a" stroke-width="2" opacity="0.9"/><text x="158" y="100" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="700" fill="#222" text-anchor="middle">Perimemb.</text><ellipse cx="100" cy="190" rx="26" ry="16" fill="#9a5fb0" stroke="#3a3a3a" stroke-width="2" opacity="0.9"/><text x="100" y="194" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="700" fill="#222" text-anchor="middle">Entrada</text><ellipse cx="220" cy="190" rx="30" ry="18" fill="#9a5fb0" stroke="#3a3a3a" stroke-width="2" opacity="0.9"/><text x="220" y="194" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="700" fill="#222" text-anchor="middle">Muscular</text><ellipse cx="190" cy="268" rx="26" ry="14" fill="#9a5fb0" stroke="#3a3a3a" stroke-width="2" opacity="0.9"/><text x="190" y="272" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="700" fill="#222" text-anchor="middle">Apical</text><text x="12" y="324" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="400" fill="#333" text-anchor="start">Salida: infundibular o subpulmonar. Perimemb.: perimembranosa,</text><text x="12" y="342" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="400" fill="#333" text-anchor="start">bajo la válvula aórtica. Entrada: tipo canal. VP: válvula pulmonar.</text><text x="12" y="360" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="400" fill="#333" text-anchor="start">VT: válvula tricúspide. Esquema orientativo.</text></svg>